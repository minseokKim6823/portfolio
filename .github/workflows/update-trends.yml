name: Update Trends

on:
  schedule:
    # 이틀마다 22:00 UTC = 다음날 07:00 KST
    - cron: "0 22 */2 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Curate trends via AWS Bedrock
        run: node scripts/update-trends.mjs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
          BEDROCK_MODEL: apac.amazon.nova-lite-v1:0

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet src/data/trends.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — 커밋 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/trends.json
            git commit -m "chore: 트렌드 큐레이션 자동 업데이트"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 푸시는 push 트리거를 발화시키지 않으므로 배포 워크플로를 직접 호출
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
